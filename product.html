<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Details - Kisan Samadhan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--green:#2E7D32;--green-light:#4CAF50;--green-pale:#E8F5E9;--ink:#0D1B0E;--ink-2:#2C3E2D;--muted:#6B7C6D;--border:#E0EBE1;--white:#FFFFFF;--off-white:#FAFAF9;--bg:#F9F9F9;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:72px;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.05);}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);}
.nav-logo-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--green-light));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;}
.nav-logo-text{font-weight:700;font-size:1rem;}
.nav-links{display:flex;gap:32px;align-items:center;}
.nav-links a{font-size:.9rem;font-weight:500;color:var(--ink-2);text-decoration:none;transition:color .2s;}
.nav-links a:hover{color:var(--green);}
.nav-actions{display:flex;gap:10px;align-items:center;}
.btn-ghost{padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);background:transparent;font-size:.85rem;font-weight:600;color:var(--ink);cursor:pointer;transition:all .2s;}
.btn-ghost:hover{border-color:var(--green);color:var(--green);background:var(--green-pale);}
.btn-primary{padding:8px 18px;border-radius:8px;border:none;background:var(--green);font-size:.85rem;font-weight:600;color:#fff;cursor:pointer;transition:all .2s;}
.btn-primary:hover{background:var(--green-light);transform:translateY(-1px);box-shadow:0 4px 14px rgba(76,175,80,.25);}
.container{max-width:1000px;margin:0 auto;padding:0 5%;}
.breadcrumb{padding:20px 5%;margin-top:72px;background:var(--white);border-bottom:1px solid var(--border);}
.breadcrumb-nav{display:flex;align-items:center;gap:8px;font-size:.9rem;}
.breadcrumb-nav a{color:var(--green);text-decoration:none;transition:color .2s;}
.breadcrumb-nav a:hover{color:var(--green-light);}
.breadcrumb-nav span{color:var(--muted);}
.product-section{padding:60px 5%;animation:fadeIn .6s ease-out;}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:60px;}
.product-image-main{width:100%;aspect-ratio:1;border-radius:16px;background:var(--green-pale);overflow:hidden;display:flex;align-items:center;justify-content:center;animation:slideUp .5s ease-out;}
.product-image-main img{width:100%;height:100%;object-fit:cover;}
.product-details{animation:slideUp .6s ease-out;}
.product-category{font-size:.8rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.product-title{font-size:2.2rem;font-weight:800;color:var(--ink);margin-bottom:12px;line-height:1.2;}
.product-price{font-size:1.8rem;font-weight:800;color:var(--green);margin-bottom:20px;}
.rating{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.rating-stars{display:flex;gap:4px;font-size:1.2rem;}
.rating-text{font-size:.9rem;color:var(--muted);}
.product-description{font-size:1rem;color:var(--muted);line-height:1.8;margin-bottom:30px;}
.product-specs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:30px;padding:20px;background:var(--off-white);border-radius:12px;}
.spec-item label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px;}
.spec-item value{font-size:.95rem;font-weight:600;color:var(--ink);display:block;}
.availability{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(76,175,80,.1);border-radius:8px;margin-bottom:30px;color:var(--green);font-weight:600;font-size:.9rem;}
.availability-icon{font-size:1.2rem;}
.product-actions{display:flex;gap:12px;margin-bottom:40px;}
.btn-add-cart{flex:1;padding:16px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-add-cart:hover{background:var(--green-light);transform:translateY(-2px);}
.btn-wishlist{flex:1;padding:16px;background:var(--off-white);color:var(--ink);border:1.5px solid var(--border);border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-wishlist:hover{border-color:var(--green);color:var(--green);background:var(--green-pale);}
.related-section{padding:60px 5%;background:var(--white);border-top:1px solid var(--border);}
.section-header{margin-bottom:40px;}
.section-header h2{font-size:1.8rem;font-weight:800;color:var(--ink);margin-bottom:8px;}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
.product-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all .3s;cursor:pointer;}
.product-card:hover{transform:translateY(-6px);box-shadow:0 10px 28px rgba(46,125,50,.12);border-color:var(--green);}
.product-card-image{width:100%;height:160px;background:var(--green-pale);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.product-card-image img{width:100%;height:100%;object-fit:cover;}
.product-card-content{padding:14px;}
.product-card-name{font-size:.95rem;font-weight:700;color:var(--ink);margin-bottom:6px;}
.product-card-price{font-size:1.1rem;font-weight:800;color:var(--green);}
@media(max-width:900px){
  .product-grid{grid-template-columns:1fr;gap:30px;}
  .product-title{font-size:1.6rem;}
  .product-specs{grid-template-columns:1fr;}
  .products-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">
    <div class="nav-logo-icon">🌾</div>
    <span class="nav-logo-text">Kisan Samadhan</span>
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="manage.html">Store</a>
  </div>
  <div class="nav-actions" id="navActions">
    <a class="btn-ghost" href="login.html">Log In</a>
    <a class="btn-primary" href="signup.html">Sign Up</a>
  </div>
</nav>

<div class="breadcrumb">
  <div class="container">
    <div class="breadcrumb-nav">
      <a href="index.html">Home</a>
      <span>/</span>
      <a href="manage.html">Store</a>
      <span>/</span>
      <span id="breadcrumbProduct">Product</span>
    </div>
  </div>
</div>

<div class="product-section">
  <div class="container">
    <div class="product-grid">
      <div>
        <img id="productImage" class="product-image-main" src="" alt="" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22500%22 height=%22500%22%3E%3Crect fill=%22%23E8F5E9%22 width=%22500%22 height=%22500%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2260%22%3E📦%3C/text%3E%3C/svg%3E'" />
      </div>
      <div class="product-details">
        <div class="product-category" id="productCategory"></div>
        <h1 class="product-title" id="productTitle"></h1>
        <div class="product-price" id="productPrice"></div>
        <div class="rating">
          <div class="rating-stars">⭐⭐⭐⭐⭐</div>
          <div class="rating-text">(1,240 reviews)</div>
        </div>
        <p class="product-description" id="productDescription"></p>
        
        <div class="product-specs">
          <div class="spec-item">
            <label>Category</label>
            <div class="value" id="specCategory"></div>
          </div>
          <div class="spec-item">
            <label>Price</label>
            <div class="value" id="specPrice"></div>
          </div>
          <div class="spec-item">
            <label>Availability</label>
            <div class="value">✓ In Stock</div>
          </div>
          <div class="spec-item">
            <label>Delivery</label>
            <div class="value">3-5 Business Days</div>
          </div>
        </div>

        <div class="availability">
          <span class="availability-icon">✓</span>
          <span>Free shipping on orders above ₹500</span>
        </div>

        <div class="product-actions">
          <button class="btn-add-cart" onclick="addToCart()">
            <span>🛒</span>
            <span>Add to Cart</span>
          </button>
          <button class="btn-wishlist" onclick="addToWishlist()">
            <span>❤️</span>
            <span>Wishlist</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="related-section">
  <div class="container">
    <div class="section-header">
      <h2>Related Products</h2>
      <p style="color:var(--muted);">You might also be interested in these products</p>
    </div>
    <div class="products-grid" id="relatedProducts"></div>
  </div>
</div>

<script>
let currentProduct = null;

function getCurrentUser(){
  const raw = localStorage.getItem('ks_current_user');
  return raw ? JSON.parse(raw) : null;
}
function buildNavActions(){
  const user = getCurrentUser();
  const actions = document.getElementById('navActions');
  if (user) {
    actions.innerHTML = `<a class="btn-ghost" href="index.html">Home</a><button class="btn-primary" onclick="logout()">Log Out</button>`;
  } else {
    actions.innerHTML = `<a class="btn-ghost" href="login.html">Log In</a><a class="btn-primary" href="signup.html">Sign Up</a>`;
  }
}
function logout(){
  localStorage.removeItem('ks_current_user');
  window.location.href = 'login.html';
}
function getProducts(){
  const raw = localStorage.getItem('ks_products');
  return raw ? JSON.parse(raw) : [];
}
function getCategoryIcon(category){
  const icons = { seeds: '🌾', fertilizers: '🧪', pesticides: '🐛', tools: '💧', other: '📦' };
  return icons[category] || icons.other;
}
function loadProduct(){
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');
  if (!productId) {
    window.location.href = 'manage.html';
    return;
  }
  const products = getProducts();
  currentProduct = products.find(p => p.id === productId);
  if (!currentProduct) {
    window.location.href = 'manage.html';
    return;
  }
  
  document.getElementById('productImage').src = currentProduct.image;
  document.getElementById('productTitle').textContent = currentProduct.title;
  document.getElementById('productCategory').textContent = `${getCategoryIcon(currentProduct.category)} ${currentProduct.category.toUpperCase()}`;
  document.getElementById('productPrice').textContent = currentProduct.price;
  document.getElementById('productDescription').textContent = currentProduct.description;
  document.getElementById('specCategory').textContent = currentProduct.category;
  document.getElementById('specPrice').textContent = currentProduct.price;
  document.getElementById('breadcrumbProduct').textContent = currentProduct.title;
  
  renderRelatedProducts();
}
function renderRelatedProducts(){
  if (!currentProduct) return;
  const products = getProducts();
  const related = products
    .filter(p => p.category === currentProduct.category && p.id !== currentProduct.id)
    .slice(0, 4);
  const grid = document.getElementById('relatedProducts');
  grid.innerHTML = related.length ? related.map(product => `
    <div class="product-card" onclick="window.location.href='product.html?id=${product.id}'">
      <div class="product-card-image">
        <img src="${product.image}" alt="${product.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23E8F5E9%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2224%22%3E${getCategoryIcon(product.category)}%3C/text%3E%3C/svg%3E'" />
      </div>
      <div class="product-card-content">
        <div class="product-card-name">${product.title}</div>
        <div class="product-card-price">${product.price}</div>
      </div>
    </div>
  `).join('') : '<p style="grid-column:1/-1;text-align:center;color:var(--muted);">No related products found</p>';
}
function addToCart(){
  if (!currentProduct) return;
  let cart = JSON.parse(localStorage.getItem('ks_cart') || '[]');
  const existing = cart.find(item => item.id === currentProduct.id);
  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({ ...currentProduct, quantity: 1 });
  }
  localStorage.setItem('ks_cart', JSON.stringify(cart));
  alert(`${currentProduct.title} added to cart!`);
}
function addToWishlist(){
  if (!currentProduct) return;
  let wishlist = JSON.parse(localStorage.getItem('ks_wishlist') || '[]');
  if (!wishlist.find(item => item.id === currentProduct.id)) {
    wishlist.push(currentProduct);
    localStorage.setItem('ks_wishlist', JSON.stringify(wishlist));
    alert(`${currentProduct.title} added to wishlist!`);
  } else {
    alert('This product is already in your wishlist!');
  }
}
window.addEventListener('load', function(){
  buildNavActions();
  loadProduct();
});
</script>
</body>
</html>
